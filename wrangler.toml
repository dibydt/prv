# wrangler.toml
name = 'provchart-api'
main = "worker.js"
compatibility_date = "2026-01-01"
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Set your secret via CLI (never put the real key here):
# npx wrangler secret put GEMINI_API_KEY

